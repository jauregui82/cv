    <script>
      // Set the "Noche"/"Día" variant on <html> synchronously, before any
      // stylesheet applies, so there is no flash of the wrong variant.
      // Mirrors docs/design/mockup.html's initialV logic exactly.
      (function () {
        try {
          var stored = localStorage.getItem('jau-v');
          var v =
            stored === 'noche' || stored === 'dia'
              ? stored
              : matchMedia('(prefers-color-scheme: light)').matches
                ? 'dia'
                : 'noche';
          document.documentElement.dataset.v = v;
        } catch (e) {
          document.documentElement.dataset.v = 'noche';
        }
      })();
    </script>
